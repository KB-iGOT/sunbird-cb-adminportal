<mat-sidenav-container class="provider-configs-sidenav-container">
  <mat-sidenav #sidenav mode="side" [(opened)]="opened">
    <ws-app-configure-provider-menu
      (activeMenu)="activeMenuItemEvent($event)"
    ></ws-app-configure-provider-menu>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="provider-content-main p-4">
      <div class="flex items-center justify-between mb-5">
        <span class="page-title">Provider Settings</span>
        <div class="action-buttons flex items-center gap-3">
          <button
            mat-flat-button
            class="flex rounded-full px-4 py-2 font-bold text-sm mat-btn-outline font-bold text-sm"
          >
            Cancel
          </button>
          <button
            mat-flat-button
            class="flex items-center rounded-full px-4 py-2 btn-primaryr font-bold text-sm mat-btn-flat"
          >
            Save
          </button>
        </div>
      </div>
      <ng-container *ngIf="activeMenuItem === 'provider_settings'">
        <ws-app-provider-settings></ws-app-provider-settings>
      </ng-container>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
