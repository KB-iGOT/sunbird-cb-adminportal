<div class="flex justify-between mb-3 flex-column info-pill">
  <div class="flex flex-row justify-between">
    <div class="flex items-center justify-center">
      <div class="flex gap-1 items-center justify-center">
        <img src="assets/icons/i-icon.svg" alt="icon" width="35" />
        <span class="bold-text ml-4">Note:- Content Upload Details: Video Guides and Tips.</span>
      </div>
    </div>
    <div>
      <img
        class="cursor-pointer"
        *ngIf="!showDetailToggle"
        (click)="showDetailToggle = !showDetailToggle"
        src="assets/icons/arrow-down.svg"
        alt="icon"
      />
      <img
        class="cursor-pointer rotate-icon"
        *ngIf="showDetailToggle"
        (click)="showDetailToggle = !showDetailToggle"
        src="assets/icons/arrow-down.svg"
        alt="icon"
      />
    </div>
  </div>
  <ng-container *ngIf="showDetailToggle">
    <div class="content-help">
      <ul>
        <li>Text-one</li>
      </ul>
    </div>
  </ng-container>
</div>
