<div class="flex flex-4 flex-column">
  <mat-card class="flex-custom">
    <div class="flex-1" role="link" tabindex="0">
      <div class="flex flex-1">
        <mat-card-title class="flex-4 mobile-margin text-capitalize margin-remove-bottom">
          <span class="mat-title">Manage Designation Approval Requests</span>
        </mat-card-title>

      </div>
      <div>
        <p>Review and approve designation name requests submitted by MDO admins.</p>
      </div>
    </div>
    <mat-card-content>
      <div class="flex flex-1 flex-column margin-fix">
        <div class="flex flex-1 filter max-height-60">
          <a href="javascript:void(0)" class="filter-option" [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'pending',
                  'ws-mat-accent-border font-medium':currentFilter !== 'pending'}" mat-button
            (click)="filter('pending');" role="button">Pending Requests
            <span *ngIf="approvalRequestCount.pending > 0"></span> ({{approvalRequestCount.pending}})</a>
          <a href="javascript:void(0)" class="filter-option" [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'approved',
                  'ws-mat-accent-border font-medium':currentFilter !== 'approved'}" mat-button
            (click)="filter('approved'); " role="button">Approved Requests
            <span *ngIf="approvalRequestCount.approved > 0"></span> ({{approvalRequestCount.approved}})</a>
          <a href="javascript:void(0)" class="filter-option" [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'rejected',
                            'ws-mat-accent-border font-medium':currentFilter !== 'rejected'}" mat-button
            (click)="filter('rejected'); " role="button">Rejected Requests
            <span *ngIf="approvalRequestCount.rejected > 0"></span> ({{approvalRequestCount.rejected}})</a>
        </div>
      </div>
      <ng-container>
        <ws-designation-approval-list-view [tableData]='tabledata' [data]='data' isCreate=true
          [currentFilter]="currentFilter" (actionsClick)="menuActions($event)"></ws-designation-approval-list-view>
      </ng-container>
    </mat-card-content>
  </mat-card>
</div>
