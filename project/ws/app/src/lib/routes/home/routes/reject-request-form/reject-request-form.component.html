<div class="view-cbp-plan">
    <div class="popup-container">
        <div class="popup-header">
            <div>
                <div class="heading">Reject Request</div>
                <div>Are you sure you want to reject {{data?.request_name}} request? Please provide a reason.</div>
            </div>
            <div class="cursor-pointer" (click)="closeDialog()">
                <mat-icon>close</mat-icon>
            </div>
        </div>
    </div>
    <div class="section-container" [formGroup]="rejectRequestForm">
        <mat-card class="mt-1">
            <div class="mt-2 section">
                <div class="sub-heading">
                    <p>Reason for Rejection <span class="error">*</span></p>
                </div>
                <div class="mt-4 additional-details">
                    <textarea formControlName="rejection_comment" placeholder="Enter reason for rejection" rows="5"
                        class="custom-textarea">
                    </textarea>
                </div>
            </div>


            <!-- <div class="mt-2 section">
                <div class="sub-heading">
                    <p>Upload Document (PDF/Word/Excel/TXT)</p>
                </div>
                <div class="file-upload-wrapper">
                    <label for="uploadDoc" class="file-upload-label">
                        <span class="file-upload-icon">📎</span>
                        <span>{{ uploadedFile?.name || 'Choose a file (PDF, Word, Excel, TXT)' }}</span>
                    </label>

                    <small class="file-upload-hint">Max file size: 25MB</small>

                    <input id="uploadDoc" type="file" (change)="onFileChange($event)"
                        accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" class="file-upload-input" />

                    <div *ngIf="uploadError" class="error">{{ uploadError }}</div>
                </div>
            </div> -->

        </mat-card>
    </div>
    <div class="popup-footer">
        <div>
            <input class="btn-active" type="button" value="Cancel" (click)="cancelForm()" />
        </div>
        <div>

            <button style="color: #fff;" [disabled]="rejectRequestForm?.invalid || loading" mat-raised-button
                [ngClass]="rejectRequestForm?.invalid ? 'btn-disable' : 'reject-btn-footer'" (click)="rejectRequest()">
                Reject Request
            </button>
        </div>
    </div>
</div>
<div class="overlay-loader" *ngIf="loading">
    <mat-spinner diameter="50"></mat-spinner>
</div>
