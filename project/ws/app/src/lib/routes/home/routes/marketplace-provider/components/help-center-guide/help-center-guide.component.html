<mat-card class="mb-4 helpCenterCard">
  <div class="flex">
    <span class="mat-body-1 font-bold-imp flex-1">{{helpCenterGuide?.header}}</span>
    <!-- //NOSONAR --><mat-icon class="cursor-pointer mat-icon mr-4" *ngIf="showTopSection"
      (click)="showTopSection = !showTopSection; callResizeEvent($event)">keyboard_arrow_up</mat-icon>
    <!-- //NOSONAR --><mat-icon class="cursor-pointer mat-icon mr-4" *ngIf="!showTopSection"
      (click)="showTopSection = !showTopSection; callResizeEvent($event)">keyboard_arrow_down</mat-icon>
  </div>
  <div class="pt-5" *ngIf="showTopSection">
    <div class="flex gap-20 items-center justify-between">
      <div class="flex flex-column gap-4">
        <ng-container *ngFor="let note of helpCenterGuide?.guideNotes">
          <div class="flex w-full gap-3">
            <div><mat-icon class="mat-icon mr-4">error_outline</mat-icon></div>
            <div>{{note}}</div>
          </div>
        </ng-container>
      </div>
      <div class="pb-3">
        <div class="helpCenterDemo flex justify-end section-2">
          <!-- //NOSONAR -->
          <div class="helpCenterDemoVideo flex flex-column flex-middle justify-center" (click)="openVideoPopup()">
            <mat-icon class="video_icon mb-2">play_arrow</mat-icon>
            <div>
              Watch how it works
            </div>
          </div><!-- //NOSONAR -->
        </div>
      </div>
    </div>
  </div>
</mat-card>
