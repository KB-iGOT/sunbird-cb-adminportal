<ws-app-help-center-guide [helpCenterGuide]="helpCenterGuide"></ws-app-help-center-guide>

<div class="flex flex-column gap-4">
  <div class="w-full flex justify-between items-center">
    <div class="header">Content Marketplace</div>
    <div>
      <button
        (click)="navigateToConfigurationV2()"
        mat-raised-button
        class="onboard-btn mat-btn-flat"
      >
        Onboard Provider
      </button>
    </div>
  </div>

  <!-- <ng-container *ngIf="!displayLoader; else showLoader"> -->
  <mat-tab-group (selectedTabChange)="handleOnTabChange($event)">
    <mat-tab label="Onboarded Providers">
      <ng-container
        *ngIf="(providersList && providersList.length > 0) || searchKey; else noContent"
      >
        <div class="flex gap-4 flex-column">
          <div>
            <ws-app-courses-list-table
              [tableData]="tabledata"
              [coursesList]="providersList"
              [menuItems]="menuItems"
              [paginationDetails]="paginationDetails"
              (searchKey)="onSearch($event)"
              [showDefaultMenu]="true"
              (actionTriggered)="providerEvents($event)"
              (pageChange)="onPageChange($event)"
            ></ws-app-courses-list-table>
          </div>
        </div>
      </ng-container>
    </mat-tab>
    <mat-tab label="Providers Request">
      <ng-container
        *ngIf="(providersList && providersList.length > 0) || searchKey; else noContent"
      >
        <div class="flex gap-4 flex-column">
          <div>
            <ws-app-courses-list-table
              [tableData]="tabledata"
              [coursesList]="providersRequestsList"
              [menuItems]="menuItems"
              [paginationDetails]="paginationDetails"
              (searchKey)="onSearchRegisteredPartners($event)"
              (actionTriggered)="providerEvents($event)"
              (pageChange)="onPageChange($event)"
            ></ws-app-courses-list-table>
          </div>
        </div>
      </ng-container>
    </mat-tab>
  </mat-tab-group>

  <ng-template #noContent>
    <div class="w-full flex flex-column items-center justify-center gap-6">
      <img class="emptyShelf-img" src="/assets/icons/empty_shelf.svg" alt="no content img" />
      <span class="no-content-text">No content partner has been onboarded</span>
    </div>
  </ng-template>
</div>
