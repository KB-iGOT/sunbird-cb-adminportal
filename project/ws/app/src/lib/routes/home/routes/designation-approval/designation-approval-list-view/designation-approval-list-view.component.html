<div class="example-container">
    <div class="example-loading-shade"></div>
    <div class="example-table-container">
        <!-- <div class="container-balanced">
            <div class="flex flex-1 custom">
                <div class="flex-2 search">
                    <div class="rsearch">
                        <div class="sinput">
                            <mat-icon class="material-icons">search</mat-icon>
                            <input type="Standard" label="" (input)="applyFilter($event.target.value)"
                                placeholder="Search" maxlength="200">
                        </div>
                    </div>
                </div>

            </div>
        </div> -->
        <!-- </mat-form-field> -->
        <mat-table #table matSort [ngStyle]="{'height': bodyHeight}" [matSortActive]="tableData!.sortColumn"
            [matSortDirection]="tableData!.sortState" [dataSource]="dataSource"
            [class]="currentFilter == 'pending' ? 'example-table table1 responsiveTable pending' : currentFilter == 'approved' ? 'example-table table1 responsiveTable approved' :  'example-table table1 responsiveTable rejected'" *ngIf="dataSource.filteredData.length > 0">
            <ng-container matColumnDef="{{col.key}}" *ngFor="let col of tableData!.columns">
                <mat-header-cell *matHeaderCellDef mat-sort-header class="h-400-r-14-l color-60 no-col-padding"
                    [ngClass]="{'margin-text': (col.key === 'organisation' || col.key === 'division' || col.key === 'email' || col.key === 'status' || col.key === 'action') }">
                    {{col.displayName}}
                </mat-header-cell>
                <mat-cell *matCellDef="let element" (click)="onRowClick(element)">
                    <span *ngIf="!col.isList && col.key !== 'status' && col.key !== 'division' && col.key !== 'email'"
                        class="h-400-r-14-l color-87" [ngClass]="{
                        'designation-text': col.key === 'designationName',
                        'margin-text': (col.key === 'organisation' || col.key === 'division' || col.key === 'email' || col.key === 'status' || col.key === 'action')
                      }">
                        {{ element[col.key] }}
                    </span>
                    <div class="flex flex-row">
                        <span *ngIf="col.key === 'status'" class="status-pill"
                            [ngClass]="'status-' + element.status?.toLowerCase()">
                            {{ element.status }}
                        </span>
                        <mat-icon *ngIf="element.status?.toLowerCase() === 'rejected' && col.key === 'status'"
                            (click)="openRejecttionCommentPopup(element)"
                            class="cursor-pointer ml-5 overflow-visible">visibility</mat-icon>
                    </div>

                    <span *ngIf="col.key === 'division'" class="division-pill">
                        {{ element.division }}
                    </span>

                    <span *ngIf="col.key === 'email'" class="email-text">
                        {{ element.email }}
                    </span>

                </mat-cell>
            </ng-container>
            <!-- <ng-container matColumnDef="Menu">
                <mat-header-cell *matHeaderCellDef class="clr-darkish-blue action-header">

                </mat-header-cell>
                <mat-cell *matCellDef="let row" class="action-cell">
                    <button type="button" mat-icon-button aria-label="action items" [matMenuTriggerFor]="cardMenu"
                        [matMenuTriggerData]="{'data':row}" class="action-btn">
                        <mat-icon>more_horiz</mat-icon>
                    </button>
                </mat-cell>
            </ng-container> -->
            <ng-container matColumnDef="Menu">
                <mat-header-cell *matHeaderCellDef class="clr-darkish-blue action-header">
                    Action
                </mat-header-cell>

                <mat-cell *matCellDef="let row" class="action-cell">
                    <div class="action-buttons" *ngIf="currentFilter === 'pending'">

                        <button mat-icon-button class="approve-btn" matTooltip="Approve"
                            (click)="approveRequest(row); $event.stopPropagation()">
                            <mat-icon class="green">check_circle</mat-icon>
                        </button>

                        <button mat-icon-button class="reject-btn" matTooltip="Reject"
                            (click)="rejectRequest(row); $event.stopPropagation()">
                            <mat-icon class="red">cancel</mat-icon>
                        </button>

                    </div>
                </mat-cell>
            </ng-container>
            <mat-header-row *matHeaderRowDef="getFinalColumns()"></mat-header-row>
            <mat-row *matRowDef="let row; columns: getFinalColumns();" (click)="selection.toggle(row);">
            </mat-row>
            <div *ngIf="dataSource.filteredData.length <= 0">
                <mat-row *matRowDef="let row; columns: getFinalColumns();"
                    (click)="selection.toggle(row); onRowClick(row)">
                    <!-- ssss -->
                </mat-row>
            </div>
        </mat-table>
    </div>
    <div *ngIf="dataSource.filteredData.length <= 0" class="h-600-s-20-m color-60 mt-4 mb-4 text-center">
        No requests found
    </div>
    <mat-paginator [hidden]="dataSource && dataSource.filteredData.length < 1" [length]="totalCount" [pageIndex]="currentPageIndex" [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions" class="mt-1">
    </mat-paginator>
</div>

<mat-menu #cardMenu="matMenu" [hidden]="currentFilter !== 'pending'">
    <ng-template matMenuContent let-rowData="data">
        <!-- <button (click)="viewRequest(rowData)" mat-menu-item name="channel-analytics-button" class="ws-mat-primary-text"
            aria-label="Analytics">
            <mat-icon>visibility</mat-icon>
            <span>View Request</span>
        </button> -->
        <button *ngIf="currentFilter === 'pending'" (click)="approveRequest(rowData)" mat-menu-item
            name="channel-analytics-button" class="ws-mat-primary-text" aria-label="Analytics">
            <mat-icon class="green">check_circle</mat-icon>
            <span>Approve Request</span>
        </button>
        <button *ngIf="currentFilter === 'pending'" (click)="rejectRequest(rowData)" mat-menu-item
            name="channel-analytics-button" class="ws-mat-primary-text" aria-label="Analytics">
            <mat-icon class="red">cancel</mat-icon>
            <span>Reject Request</span>
        </button>

    </ng-template>
</mat-menu>

<!-- Popup Overlay -->
<div class="popup-overlay" *ngIf="showRejectPopupFlag">
    <div class="popup-card">

        <!-- Close Button -->
        <button class="close-btn" (click)="closeRejectPopup()">&times;</button>

        <!-- Title -->
        <h2>Rejection Reason</h2>

        <!-- Subtitle -->
        <p class="subtitle">
            This request was rejected for the following reason:
        </p>

        <!-- Error Box -->
        <div class="error-box">
            {{rejectionDetail?.reviewer_comments}}
        </div>

    </div>
</div>
