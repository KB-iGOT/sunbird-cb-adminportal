<div class="flex flex-4 flex-column">
  <mat-card class="flex-custom">
    <mat-card-header class="flex-custom-m mb-3" id="directorycs">
      <div class="flex-1" role="link" tabindex="0">
        <div class="flex flex-1">
          <mat-card-title class="flex-4 mobile-margin text-capitalize margin-remove-bottom">
            <span class="mat-title">Directory</span>
          </mat-card-title>
        </div>
      </div>
    </mat-card-header>
    <mat-card-content>
      <div class="flex flex-1 flex-column margin-fix">
        <div class="flex flex-1 filter max-height-60">
          <div *ngFor="let department of departmentHearders">
            <a *ngIf="department==='CBC'" class="filter-option" [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'cbc',
                           'ws-mat-accent-border font-medium':currentFilter !== 'cbc'}" mat-button
              [routerLink]="'/app/home/directory/cbc'" (click)="filter(department.toLowerCase())" role="button">
              CBC</a>

            <a *ngIf="department==='CBP Providers'" class="filter-option" [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'cbp-providers',
                           'ws-mat-accent-border font-medium':currentFilter !== 'cbp-providers'}" mat-button
              [routerLink]="'/app/home/directory/cbp-providers'" (click)="filter(department.toLowerCase())"
              role="button">
              CBP Providers</a>

            <a *ngIf="department==='Organisation'" class="filter-option" [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'organisation',
                           'ws-mat-accent-border font-medium':currentFilter !== 'state'}" mat-button
              [routerLink]="'/app/home/directory/organisation'" (click)="filter(department.toLowerCase())"
              role="button">
              Organisation</a>

          </div>
          <a class="filter-option" [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'orgHierarchies',
                        'ws-mat-accent-border font-medium':currentFilter !== 'state'}" mat-button
            [routerLink]="'/app/home/directory/orgHierarchies'" (click)="filter('orgHierarchies')" role="button">
            Organisation Hierarchies</a>
          <a class="filter-option" [ngClass]="{'ws-mat-accent-border-active' : currentFilter === 'volunteer',
                        'ws-mat-accent-border font-medium':currentFilter !== 'volunteer'}" mat-button
            [routerLink]="'/app/home/directory/volunteer'" (click)="filter('volunteer')" role="button">
            Volunteer Organisations</a>
        </div>
      </div>
      <ng-container *ngIf="currentFilter !== 'orgHierarchies'">
        <ws-widget-directory-table [selectedDepartment]='currentDepartment' [tableData]='tabledata' [data]='data'
          [needCreate]="isAllowed(allowedCreateRoles)" (eOnRowClick)="onRoleClick($event)" [currentTab]="currentTab"
          (actionsClick)="actionClick($event)" (pageChangeEvent)="onPageChange($event)"
          (searchByEnterKey)="onEnterkySearch($event)">
        </ws-widget-directory-table>
      </ng-container>
      <ng-container *ngIf="currentFilter === 'orgHierarchies'">
        <ws-app-org-hierarchy-mapping></ws-app-org-hierarchy-mapping>
      </ng-container>
    </mat-card-content>
  </mat-card>
</div>
