<div class="back-route-block flex items-center gap-1 h-full">
  <ng-container *ngFor="let crumb of data; let i = index">
    <mat-icon *ngIf="i !== 0" class="breadcrumb-icon" [class.active]="crumb?.active">
      keyboard_arrow_right
    </mat-icon>

    <div
      class="breadcrumb-item cursor-pointer flex items-center gap-1"
      [class.active]="crumb?.active"
      (click)="navigate(crumb)"
    >
      <mat-icon *ngIf="i === 0">arrow_back</mat-icon>
      {{ crumb?.label }}
    </div>
  </ng-container>
</div>
