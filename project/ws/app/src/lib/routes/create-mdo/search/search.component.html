<div class="flex flex-1 flex-row margin-top-m margin-bottom-m">
    <div class="search flex margin-right-m" [ngClass]="{'disable': isContentLive}">
        <div class="rsearch flex w-full">
            <div class="sinput">
                <mat-icon class=" mat-icon notranslate material-icons mat-icon-no-color">search</mat-icon>
                <input [(ngModel)]="searchText" (keyup.enter)="searchData($event)" label="" placeholder="Search"
                    type="Standard" [ngClass]="{'disable': isContentLive}">
            </div>

        </div>
    </div>
</div>
