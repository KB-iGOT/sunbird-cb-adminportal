<div class="snackbar-wrapper">
  <div class="flex items-center justify-between">
    <div class="message flex items-center gap-4">
      <ng-container *ngIf="data?.type === 'success'">
        <mat-icon class="text-white">check</mat-icon>
      </ng-container>

      <ng-container *ngIf="data?.type === 'error'">
        <img src="/assets/icons/error-icon.svg" alt="error" width="24" height="24" style="filter: brightness(0) invert(1)" />
      </ng-container>

      <span class="text-white">{{ data?.message }}</span>
    </div>

    <div class="close">
      <mat-icon class="cursor-pointer text-white" (click)="snackBarRef.dismiss()"> close </mat-icon>
    </div>
  </div>
</div>
