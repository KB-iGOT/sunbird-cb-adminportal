<div class="org-hierarchy-container">
  <div class="flex margin-bottom-s">
    <ng-container *ngIf="!checkIfStateAdmin()">
      <div class="flex filter max-height-60 gap-4">
        <div *ngFor="let orglist of orgTypeList">
          <button mat-stroked-button class="btn-common"
            [ngClass]="{'btn-primary': selectedOrgType === orglist.value, 'btn-secondary': selectedOrgType !== orglist.value}"
            (click)="orgSelected(orglist.value)">{{orglist.name}}</button>
        </div>
        <div class="select-search-container">
          <mat-form-field appearance="outline" class="w-full custom-height-select">
            <mat-select [formControl]="organizationCtrl" placeholder="Select" #singleSelect
              [panelClass]="'mat-select-panel-below'" disableOptionCentering [disableOptionCentering]="true">
              <div class="search-container">
                <input type="text" [formControl]="searchControl" placeholder="Search..."
                  (keydown)="$event.key === ' ' ? $event.stopPropagation() : null" (click)="$event.stopPropagation()"
                  class="search-input" #searchInput>
              </div>
              <mat-option *ngFor="let organization of filteredOrganizations | orderBy: 'orgName'"
                [value]="organization.identifier">
                {{organization.orgName}}
              </mat-option>
              <mat-option *ngIf="filteredOrganizations.length === 0" disabled>
                No matching {{selectedOrgType}} found
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </ng-container>
    <ng-container *ngIf="hasOrgHierarchyFrameworkId()">
      <div class="bulk-upload-container flex gap-4 margin-left-auto">
        <button mat-button class="btn-common btn-with-out-border flex flex-middle" type="button"
          (click)="downloadTemplate()">
          Download template
          <mat-icon svgIcon="download-icon" class="btn-icon"></mat-icon>
        </button>
        <button mat-button class="btn-common btn-secondary" type="button" (click)="exportData()">Export</button>
        <input type="file" #fileInput accept=".xlsx" style="display: none" (change)="onFileSelected($event)">
        <button mat-button class="btn-common btn-primary" type="button" (click)="openBulkUploadDialog()">
          Bulk Upload
        </button>
      </div>
    </ng-container>
  </div>
  <ng-container *ngIf="organizationCtrl?.value && hasOrgHierarchyFrameworkId() && !bulkUploadRefresh">
    <div class="tree-view-container" style="height: calc(100vh - vh)">
      <lib-tree-view [environment]="environmentVal" [taxonomyConfig]="defaultOrgConfig"
        [orgSelectedData]="getOrgDetails()" (loaderEnable)="checkloader($event)"
        (manageOrg)="redirectOrg($event)"></lib-tree-view>
    </div>
  </ng-container>
  <ng-container *ngIf="organizationCtrl?.value && !hasOrgHierarchyFrameworkId()">
    <div class="no-hierarchy-container">
      <p>The selected organization does not have a hierarchy framework configured.</p>
      <p>Do you want to crate a new framework?</p>
      <div class="flex gap-4 btn-container justify-center">
        <button mat-button class="btn-common btn-primary" (click)="createNewHierarchy()">Create</button>
        <button mat-button class="btn-common btn-secondary" (click)="cancelHierarchyCreation()">Cancel</button>
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="!organizationCtrl?.value && !hasOrgHierarchyFrameworkId() && !checkIfStateAdmin()">
    <div class="no-hierarchy-container flex flex-col flex-middle">
      <div class="no-org-selected">
        <mat-icon svgIcon="frac-no-connection" class="info-icon"></mat-icon>
      </div>
      <p>Select state or center to proceed.</p>
    </div>
  </ng-container>
</div>
