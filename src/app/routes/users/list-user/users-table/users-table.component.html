<div class="table-container">

  <!-- Skeleton loader — replaces table while loading -->
  <div class="skeleton-table" *ngIf="loading">
    <div class="skeleton-header">
      <div class="skeleton-col" style="width:160px"></div>
      <div class="skeleton-col" style="width:210px"></div>
      <div class="skeleton-col" style="width:130px"></div>
      <div class="skeleton-col" style="width:220px"></div>
      <div class="skeleton-col" style="width:90px"></div>
      <div class="skeleton-col" style="width:160px"></div>
      <div class="skeleton-col" style="width:70px"></div>
    </div>
    <div class="skeleton-row" *ngFor="let r of skeletonRows">
      <div class="skeleton-cell" style="width:160px">
        <div class="shimmer"></div>
      </div>
      <div class="skeleton-cell" style="width:210px">
        <div class="shimmer"></div>
      </div>
      <div class="skeleton-cell" style="width:130px">
        <div class="shimmer" style="width:80%"></div>
      </div>
      <div class="skeleton-cell" style="width:220px">
        <div class="shimmer"></div>
      </div>
      <div class="skeleton-cell" style="width:90px">
        <div class="shimmer pill"></div>
      </div>
      <div class="skeleton-cell" style="width:160px">
        <div class="shimmer" style="width:70%"></div>
      </div>
      <div class="skeleton-cell" style="width:70px">
        <div class="shimmer circle"></div>
      </div>
    </div>
  </div>

  <!-- Actual table — hidden while loading -->
  <ng-container *ngIf="!loading">
    <table mat-table [dataSource]="dataSource" class="users-table">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">
          <span class="cell-text" [matTooltip]="getUserName(user)" matTooltipShowDelay="300">{{ getUserName(user)
            }}</span>
        </td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">
          <span class="cell-text" [matTooltip]="getUserEmail(user)" matTooltipShowDelay="300">{{ getUserEmail(user)
            }}</span>
        </td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let user">
          <span class="cell-text">{{ getUserPhone(user) }}</span>
        </td>
      </ng-container>

      <!-- Organization Column -->
      <ng-container matColumnDef="organization">
        <th mat-header-cell *matHeaderCellDef>Organization</th>
        <td mat-cell *matCellDef="let user">
          <span class="cell-text" [matTooltip]="user.rootOrgName || 'N/A'" matTooltipShowDelay="300">{{ user.rootOrgName
            || 'N/A' }}</span>
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let user">
          <span class="status-chip" [ngClass]="getStatusClass(user)">
            {{ getStatusLabel(user) }}
          </span>
        </td>
      </ng-container>

      <!-- Roles Column -->
      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Roles</th>
        <td mat-cell *matCellDef="let user">
          <span class="cell-text" [matTooltip]="getUserRoles(user).join(', ')" matTooltipShowDelay="300">
            <span *ngFor="let role of getUserRoles(user); let last = last">{{ role }}{{ !last ? ', ' : '' }}</span>
          </span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <ws-user-actions-menu [user]="user" (actionSelected)="onUserAction($event)">
          </ws-user-actions-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- No data row -->
      <tr class="no-data-row" *matNoDataRow>
        <td class="no-data-cell" [attr.colspan]="displayedColumns.length">
          <div class="no-data" *ngIf="!loading">
            <mat-icon>search_off</mat-icon>
            <span>No users found. Try adjusting your search criteria.</span>
          </div>
        </td>
      </tr>
    </table>

    <mat-paginator [length]="totalCount" [pageSize]="pageSize" [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions" (page)="onPageChange($event)" showFirstLastButtons>
    </mat-paginator>
  </ng-container>

</div>
